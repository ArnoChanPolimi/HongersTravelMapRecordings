<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arno's Travel Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css" />
  <link rel="stylesheet" href="css/style.css?v=20260726-clustrmap-https">
</head>

<body>
  <div class="header">
    <h1>My Travel Map</h1>
    <p class="subtitle">Discovery</p>
    <a id="clustrmap-link" href="https://clustrmaps.com/site/1c80g" target="_blank" rel="noopener noreferrer" title="Visitor statistics" aria-label="Open visitor statistics">🌏</a>
  </div>

  <div id="map"></div>
  <div class="country-dock" id="country-dock">
    <button class="country-toggle" id="country-toggle" type="button" aria-expanded="true" aria-controls="country-panel">
      <span class="country-toggle-text">Countries</span>
      <span class="country-toggle-icon" aria-hidden="true">⌄</span>
    </button>
    <div class="country-panel" id="country-panel">
      <div class="country-strip" id="country-strip"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>

  <script src="js/data.js"></script>
  <script src="js/main.js?v=20260726-clustrmap-https"></script>
</body>

</html>
